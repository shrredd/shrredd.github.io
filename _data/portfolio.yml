# Portfolio companies, shown on the homepage as a wall of logos.
#
# Tiles are grouped by stage, later stages first. Within a stage they appear
# in the order listed here.
#
# Only list companies that are publicly announced (a live website, announced
# funding, or a listing on Pear's site). Never add check sizes, valuations,
# ownership, or internal notes: this repository and the site are public.
#
# - slug: lowercase id; /#portfolio-<slug> links to the tile
# - name / url: the company's name as it writes it, and its homepage
# - tag: two or three words on what it does
# - stage: pre-seed | seed | series-a | series-b (the company's latest
#   announced round, not Pear's first check)
# - about: one plain sentence, written for this site from the company's own
#   site; it shows when you point at the tile
# - round: optional; the latest announced round, or the investors the company
#   names itself, from a public source (press, or the company's own site), for
#   example "$37M Series A led by Lightspeed, 2026". It shows under the sentence.
#   Never Pear's check size, a valuation, or a round that is not announced.
# - round_source: the public link behind `round` (kept here, not shown)
# - logo: mask image in static/portfolio/ (default <slug>.png); see README
# - logo_ratio: the logo image's width divided by its height
# - logo_scale: optional size correction (default 1); above 1 for light,
#   thin logos, below 1 for heavy ones, so all logos look the same size

